[project]
name = "agent-firewall"
version = "0.1.0"
description = "Enterprise AI agent security and governance platform: a policy-enforcing MCP gateway"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # MCP gateway and downstream servers
    "mcp>=2,<3",
    "httpx>=0.27",
    # API and data
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Policy files and schema validation
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # Auth helpers
    "argon2-cffi>=23.1",
    # LLM and security investigation workflow
    "google-genai>=1.0",
    "langgraph>=0.2",
    # Anomaly detection (used after rules and a baseline dataset exist)
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/dashboard", ".bob"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.setuptools.packages.find]
include = ["apps*", "agents*", "gateway*", "mcp_servers*", "monitoring*", "workflows*", "core*"]

[tool.uv]
link-mode = "copy"

