name: agent-firewall

# Stage 0: only PostgreSQL for now. Gateway, MCP servers and API are added in later stages.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentfirewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agentfirewall}
    ports:
      # Published to localhost only, for development tools. Not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentfirewall} -d ${POSTGRES_DB:-agentfirewall}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
